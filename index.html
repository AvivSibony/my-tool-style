<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Closet AI</title>

<style>
:root{--bg:#f1f1ee;--surface:#fff;--ink:#15171a;--muted:#6b6f76;--line:#dcdcd7;--accent:#3347c4;--on-accent:#fff;--tab-h:58px;--studio:#ebeae6}
@media (prefers-color-scheme:dark){:root{--bg:#101113;--surface:#1b1c20;--ink:#f0f0ec;--muted:#9a9ea6;--line:#2c2e33;--accent:#93a5ff;--on-accent:#101113}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"SF Hebrew","Arial Hebrew",system-ui,sans-serif;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.5px}
.icon-btn{background:none;border:0;color:var(--ink);padding:10px;margin:-10px;font-size:22px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:8px 20px 24px}
.sub{color:var(--muted);margin:0 0 20px}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:36px 24px;text-align:center;margin-top:12px}
.empty b{display:block;font-size:19px;margin-bottom:6px}
.empty p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 22px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 18px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:var(--tab-h);background:none;border:0;color:var(--muted);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button[aria-selected=true]{color:var(--accent);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;border-radius:20px;background:var(--surface);color:var(--ink);width:min(92vw,420px);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 14px;font-size:20px}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.status{min-height:1.5em;margin:10px 0 0;font-size:14px;color:var(--muted)}
.status.err{color:#d13b3b}.status.ok{color:#2e9d5b}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 10px;padding:2px 20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip.sm{padding:6px 14px;white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cell{position:relative;aspect-ratio:4/5;border:0;border-radius:14px;background:var(--studio);padding:6px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font:inherit;font-size:13px}
.cell img{max-width:100%;max-height:100%;object-fit:contain}
.flag{position:absolute;top:6px;inset-inline-start:6px;background:var(--accent);color:var(--on-accent);font-size:11px;padding:2px 8px;border-radius:999px}
.fab{position:fixed;inset-inline-end:20px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab[hidden]{display:none}
.big{width:100%;max-height:340px;object-fit:contain;background:var(--studio);border-radius:14px}
select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:6px}
label select{font-weight:400}
.grid.two{grid-template-columns:repeat(2,1fr)}
.cap{position:absolute;bottom:6px;inset-inline-start:10px;font-size:12px;color:var(--muted)}
.note{background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);margin:14px 0 0}
.why{margin:16px 0 4px;font-size:17px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 14px}
.btn.big{padding:15px;font-size:17px;width:100%}
.btn:disabled{opacity:.6}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -20px 0;padding:2px 20px 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 84%;scroll-snap-align:center;background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:340px}
.day .head{display:flex;justify-content:space-between;align-items:baseline}
.muted{color:var(--muted);font-weight:400;font-size:14px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini div{aspect-ratio:4/5;background:var(--studio);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini img{max-width:100%;max-height:100%;object-fit:contain}
.day select{margin:0}
.day .row{margin-top:auto}
.cell img[data-s],.mini img[data-s]{width:100%;height:100%;object-fit:cover}
.cell:has(img[data-s]){padding:0}
.fig{position:relative;aspect-ratio:400/760;background:var(--studio);border-radius:20px;overflow:hidden;isolation:isolate;max-width:320px;margin:0 auto}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig img{position:absolute;height:auto;max-width:none}
</style>
</head>
<body>
<header><h1 id="title"></h1><button class="icon-btn" id="gear" aria-label="הגדרות">⚙︎</button></header>

 <button role="tab" data-tab="closet"><svg viewBox="0 0 24 24"><path d="M12 7V5.5a2 2 0 1 1 2 2M12 7 3 14.5a1 1 0 0 0 .6 1.8h16.8a1 1 0 0 0 .6-1.8L12 7z"/></svg>ארון</button>
 <button role="tab" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>לוז</button>
 <button role="tab" data-tab="today"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 16l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>סט להיום</button>

<dialog id="settings">
 <h2>הגדרות</h2>
 <label for="key">מפתח Claude API</label>
 <input id="key" type="password" autocomplete="off" placeholder="sk-ant-...">
 <label for="model">מודל</label>
 <input id="model" autocomplete="off">
 <p class="status" id="status"></p>
 <p class="hint">מה יוצא מהטלפון: תמונה קטנה אחת של כל בגד חדש, ל-Claude בלבד. לסט נשלחת רשימת טקסט בלי תמונות. מיקום מעוגל (כ-10 ק״מ) נשלח ל-Open-Meteo. הארון והתמונות נשארים בטלפון.</p>
 <div class="row"><button class="btn" id="test">בדיקת חיבור</button><button class="btn primary" id="save">שמירה</button></div>
 <div class="row"><button class="btn" id="wipe">מחיקת כל הנתונים מהמכשיר</button></div>

<button class="fab" id="fab" aria-label="הוספת בגדים">+</button>
<input type="file" id="pick" accept="image/*" multiple hidden>
<dialog id="edit"><h2>עריכת פריט</h2><div id="editBody"></div>
 <div class="row"><button class="btn" id="eDel">מחיקה</button><button class="btn primary" id="eSave">שמירה</button></div></dialog>

<dialog id="swap"><h2>החלפת פריט</h2><div class="grid two" id="swapGrid"></div></dialog>

<script>
/* ========== Enums (שלב 1: מודל הנתונים) ========== */
const CATEGORIES=[{id:'top',label:'חולצות'},{id:'bottom',label:'מכנסיים וחצאיות'},{id:'dress',label:'שמלות'},{id:'outerwear',label:'מעילים וג׳קטים'},{id:'shoes',label:'נעליים'},{id:'accessory',label:'אקססוריז'}];
const COLORS=[['black','שחור','#000'],['white','לבן','#fff'],['gray','אפור','#888'],['beige','בז׳','#ddcdab'],['brown','חום','#7a5230'],['red','אדום','#d33'],['orange','כתום','#f08a24'],['yellow','צהוב','#f2cf3a'],['green','ירוק','#3a9a5b'],['blue','כחול','#2f5fd0'],['purple','סגול','#7a4bc4'],['pink','ורוד','#ee8fb0'],['multi','צבעוני','#6b5bd6']].map(([id,label,hex])=>({id,label,hex}));
const SEASONS=[{id:'summer',label:'קיץ'},{id:'winter',label:'חורף'},{id:'transitional',label:'מעבר'},{id:'allYear',label:'כל השנה'}];
// level מספרי: ה-Critic משווה פורמליות בקוד, בלי קריאה ל-AI
const FORMALITIES=[{id:'casual',label:'יומיומי',level:0},{id:'smartCasual',label:'חצי רשמי',level:1},{id:'formal',label:'רשמי',level:2}];
const OCCASIONS=[{id:'everyday',label:'יום יום',min:0,max:1},{id:'work',label:'עבודה',min:0,max:2},{id:'date',label:'דייט',min:1,max:2},{id:'festive',label:'חגיגי',min:1,max:2},{id:'workout',label:'אימון',min:0,max:0},{id:'evening',label:'בילוי ערב',min:1,max:2}];

/* ========== Models ========== */
const newItem=(imageId,o={})=>({id:crypto.randomUUID(),createdAt:Date.now(),imageId,category:'top',color:'black',season:'allYear',formality:'casual',manuallyEdited:false,lastWornAt:null,...o});
// סט נשמר רק ב"לבשתי היום". itemIds ולא אובייקטים: מחיקת פריט לא שוברת היסטוריה.
const newOutfit=(occasion,itemIds,explanation,temperatureC=null)=>({id:crypto.randomUUID(),createdAt:Date.now(),occasion,itemIds,explanation,temperatureC,wornOn:null});

/* ========== DB: IndexedDB מקומי, בלי שרת ========== */
const DB=(()=>{
  let p;
  const open=()=>p??=new Promise((res,rej)=>{
    const r=indexedDB.open('closet-ai',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('outfits',{keyPath:'id'});d.createObjectStore('images');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  const run=async(store,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq?.result);t.onerror=()=>rej(t.error);});};
  return{close:async()=>(await open()).close(),all:s=>run(s,'readonly',o=>o.getAll()),get:(s,k)=>run(s,'readonly',o=>o.get(k)),put:(s,v,k)=>run(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)),del:(s,k)=>run(s,'readwrite',o=>o.delete(k))};
})();

/* תמונות כ-Blob במאגר נפרד (כמו ImageStore): הרשימות נשארות קלות */
const ImageStore={
  async save(blob){const id=crypto.randomUUID();await DB.put('images',blob,id);return id;},
  load:id=>DB.get('images',id),
  remove:id=>DB.del('images',id)
};

/* ========== Claude client (קריאה ישירה מהדפדפן) ========== */
const Claude={
  key:()=>localStorage.getItem('apiKey')||'',
  model:()=>localStorage.getItem('model')||'claude-sonnet-5-5',
  async send({system,content,maxTokens=1000}){
    if(!this.key())throw new Error('חסר מפתח API. מוסיפים אותו בהגדרות.');
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':this.key(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:this.model(),max_tokens:maxTokens,system,messages:[{role:'user',content}]})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'שגיאה '+r.status);}
    const d=await r.json();return d.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  }
};

/* ========== Agents: חוזים בלבד, המימוש בשלבים 2 ו-3 ========== */
/* ---------- כלי תמונה ---------- */
const loadImg=b=>new Promise((res,rej)=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u;});
async function shrink(blob,max,type='image/png',bg){const i=await loadImg(blob),k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);}x.drawImage(i,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,type,.85));}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b);});
/* הסרת רקע בדפדפן (בפעם הראשונה מורידה מודל גדול) */
let bgLib;const removeBg=async b=>{bgLib??=import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm').catch(e=>{bgLib=null;throw e});return (await bgLib).removeBackground(b);};

/* ---------- סטודיו: רקע אפור-חם אחיד, הפריט במרכז, צל רך (כמו תמונות מוצר) ---------- */
function bbox(i){const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0);
  const d=x.getImageData(0,0,c.width,c.height).data;let a=c.width,b=c.height,r=0,t=0;
  for(let y=0;y<c.height;y++)for(let u=0;u<c.width;u++)if(d[(y*c.width+u)*4+3]>20){if(u<a)a=u;if(u>r)r=u;if(y<b)b=y;if(y>t)t=y;}
  return r<a?[0,0,c.width,c.height]:[a,b,r-a+1,t-b+1];}
async function studio(blob,w){
  const i=await loadImg(blob),[sx,sy,sw,sh]=bbox(i),h=Math.round(w*1.25),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#ebeae6';x.fillRect(0,0,w,h);
  const k=Math.min(w*.64/sw,h*.72/sh),dw=sw*k,dh=sh*k;studio.lastBox=[((w-dw)/2)/w,(h*.47-dh/2)/h,dw/w,dh/h];
  x.shadowColor='rgba(70,64,56,.30)';x.shadowBlur=w*.05;x.shadowOffsetY=w*.025;
  x.drawImage(i,sx,sy,sw,sh,(w-dw)/2,h*.47-dh/2,dw,dh);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}
const hasAlpha=i=>{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.drawImage(i,0,0,1,1,0,0,1,1);return x.getImageData(0,0,1,1).data[3]<10;};
/* פריטים ישנים (עם רקע שקוף): ממירים פעם אחת לסגנון הסטודיו */
async function migrateStudio(){
  for(const it of await DB.all('items')){
    if(it.status!=='ready'||it.studio||it.studioChecked||!it.imageId)continue;
    try{
      const src=await ImageStore.load(it.imageId),fresh=await DB.get('items',it.id);
      if(!src||!fresh)continue;
      if(!hasAlpha(await loadImg(src))){fresh.studioChecked=true;await DB.put('items',fresh);continue;}
      const fin=await straighten(src,0,fresh.category).catch(()=>src),full=await studio(fin,800),thumb=await studio(fin,300),old=[fresh.imageId,fresh.thumbId];
      fresh.imageId=await ImageStore.save(full);fresh.thumbId=await ImageStore.save(thumb);fresh.studio=true;fresh.box=[...studio.lastBox];
      await DB.put('items',fresh);for(const o of old)await ImageStore.remove(o);
    }catch(e){}
  }
  render();
}

/* ---------- ישור: סיבוב לפי "איפה למעלה" (Claude) + יישור עדין לפי סימטריה ---------- */
async function rotateBlob(blob,deg){
  const i=await loadImg(blob),r=deg*Math.PI/180,sn=Math.abs(Math.sin(r)),cs=Math.abs(Math.cos(r));
  const c=document.createElement('canvas');c.width=Math.ceil(i.width*cs+i.height*sn);c.height=Math.ceil(i.width*sn+i.height*cs);
  const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(r);x.drawImage(i,-i.width/2,-i.height/2);
  return new Promise(res=>c.toBlob(res,'image/png'));
}
/* בגדים כמעט תמיד סימטריים. מחפשים את הזווית (עד 30 מעלות) שבה הצללית הכי דומה לבבואה שלה */
function skewAngle(M,n){
  const score=th=>{const co=Math.cos(th),si=Math.sin(th),R=new Uint8Array(n*n);let sx=0,s=0;
    for(let y=0;y<n;y++)for(let u=0;u<n;u++){const U=u-n/2,V=y-n/2,a=Math.round(U*co+V*si+n/2),b=Math.round(-U*si+V*co+n/2);
      if(a>=0&&a<n&&b>=0&&b<n&&M[b*n+a]){R[y*n+u]=1;sx+=u;s++;}}
    if(!s)return 0;const cx=sx/s;let I=0,O=0;
    for(let y=0;y<n;y++)for(let u=0;u<n;u++){const m=Math.round(2*cx-u),p=R[y*n+u],q=m>=0&&m<n?R[y*n+m]:0;if(p&&q)I++;if(p||q)O++;}
    return I/O;};
  const base=score(0);let best=0,bs=base;
  for(let a=-30;a<=30;a+=1.5){const sc=score(a*Math.PI/180);if(sc>bs){bs=sc;best=a;}}
  const lo=best-1.5,hi=best+1.5;   // גבולות קבועים: החיפוש העדין לא ממשיך לטפס מעבר לטווח
  for(let a=lo;a<=hi;a+=.25){const sc=score(a*Math.PI/180);if(sc>bs){bs=sc;best=a;}}
  return bs>.8&&bs>base+.01?best:0;   // אם הפריט לא סימטרי, לא מסובבים
}
async function skew(blob){
  const i=await loadImg(blob),n=160,k=n/Math.max(i.width,i.height),c=document.createElement('canvas');c.width=c.height=n;
  const x=c.getContext('2d',{willReadFrequently:true}),w=i.width*k,h=i.height*k;x.drawImage(i,(n-w)/2,(n-h)/2,w,h);
  const d=x.getImageData(0,0,n,n).data,M=new Uint8Array(n*n);for(let p=0;p<n*n;p++)M[p]=d[p*4+3]>20?1:0;
  return skewAngle(M,n);
}
async function straighten(blob,rot,cat){
  let b=rot?await rotateBlob(blob,rot):blob;
  if(['top','bottom','dress','outerwear'].includes(cat)){const a=await skew(b);if(Math.abs(a)>.4)b=await rotateBlob(b,a);}
  return b;
}

/* ---------- Vision Agent: תמונה → סוג, צבע, עונה, פורמליות ---------- */
const VisionAgent={async analyze(jpeg){
  const ids=l=>l.map(x=>x.id).join('|');
  const t=await Claude.send({system:'You identify the single clothing item in a photo. Reply with JSON only, no other text.',maxTokens:150,
    content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:await b64(jpeg)}},
      {type:'text',text:`Return {"category":"${ids(CATEGORIES)}","color":"${ids(COLORS)}","season":"${ids(SEASONS)}","formality":"${ids(FORMALITIES)}","rotate":"0|90|180|270"} with exactly one value per key. color = dominant color. rotate = the clockwise rotation in degrees needed so the garment is upright like a catalog photo (collar, neckline or waistband at the top); use 0 if it is already upright or you are unsure.`}]});
  const o=JSON.parse(t.match(/\{[\s\S]*\}/)[0]),ok=(l,v,d)=>l.some(x=>x.id===v)?v:d;
  return{category:ok(CATEGORIES,o.category,'top'),color:ok(COLORS,o.color,'black'),season:ok(SEASONS,o.season,'allYear'),formality:ok(FORMALITIES,o.formality,'casual'),rotate:[0,90,180,270].includes(+o.rotate)?+o.rotate:0};
}};

/* ---------- תור עיבוד: ממתין ← מעבד ← מוכן. נשמר ב-DB, ממשיך אחרי סגירה ---------- */
let busy=false;
async function enqueue(files){
  if(!Claude.key())alert('אין מפתח API, אז הפריטים יסומנו "בדוק" בלי זיהוי. אפשר להוסיף מפתח בהגדרות.');
  for(const f of files){const srcId=await ImageStore.save(await shrink(f,1200,'image/jpeg'));
    await DB.put('items',newItem(null,{status:'pending',srcId,thumbId:null,needsReview:false}));}
  render();runQueue();
}
async function runQueue(){
  if(busy)return;busy=true;
  try{for(;;){
    const it=(await DB.all('items')).find(i=>i.status==='pending');if(!it)break;
    it.status='processing';await DB.put('items',it);render();
    const src=await ImageStore.load(it.srcId);let cut=src,review=false;
    let bgOk=true;try{cut=await removeBg(src);}catch(e){review=true;bgOk=false;}          // נכשל: נשמרת התמונה המקורית
    let rot=0;
    try{const{rotate,...attrs}=await VisionAgent.analyze(await shrink(cut,512,'image/jpeg','#fff'));Object.assign(it,attrs);rot=rotate;}catch(e){review=true;}
    let fin=cut;if(bgOk){try{fin=await straighten(cut,rot,it.category);}catch(e){fin=cut;}}
    it.imageId=await ImageStore.save(bgOk?await studio(fin,800):await shrink(cut,900));it.box=bgOk?[...studio.lastBox]:null;
    it.thumbId=await ImageStore.save(bgOk?await studio(fin,300):await shrink(cut,300));it.studio=bgOk;
    await ImageStore.remove(it.srcId);
    Object.assign(it,{srcId:null,status:'ready',needsReview:review});await DB.put('items',it);render();
  }}finally{busy=false;}
}
/* ---------- חוקי עזר ---------- */
const NEUTRAL=['black','white','gray','beige','brown'];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAT=id=>CATEGORIES.find(c=>c.id===id).label;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const formalityOK=(i,o)=>{const l=FORMALITIES.find(f=>f.id===i.formality).level;return l>=o.min&&l<=o.max;};
const seasonOK=(i,t)=>i.season==='allYear'||(t>=25?i.season==='summer':t<=15?i.season!=='summer':t>=20?i.season!=='winter':i.season!=='summer');
const needsOuter=w=>w.temperatureC<=17||w.isRaining;
const recent=i=>i.lastWornAt&&Date.now()-i.lastWornAt<3*864e5;

/* ---------- סוכן 7: סטייליסט (Claude מקבל רק טקסט, לא תמונות) ---------- */
const StylistAgent={async propose(cands,occ,w,feedback,avoid=[]){
  const rows=cands.map((i,n)=>`${n+1}|${i.category}|${i.color}|${i.season}|${i.formality}${recent(i)?'|worn recently':''}${avoid.includes(i.id)?'|previous outfit':''}`).join('\n');
  const t=await Claude.send({maxTokens:300,
    system:'You are a personal stylist. Build ONE outfit using only the numbered items. It needs shoes, and either a dress or a top plus a bottom. Add outerwear only if one is listed and the weather needs it. Prefer harmonious colors (at most two non-neutral colors). Avoid items tagged "worn recently" or "previous outfit" when possible. Reply with JSON only: {"items":[numbers],"why":"one or two short sentences in Hebrew on why it fits"}',
    content:`Occasion: ${occ}\nTemperature: ${w.temperatureC}C, rain: ${w.isRaining}\n${feedback?'Fix these problems: '+feedback+'\n':''}Items (number|category|color|season|formality):\n${rows}`});
  const o=JSON.parse(t.match(/\{[\s\S]*\}/)[0]);
  return{itemIds:o.items.map(n=>cands[n-1]?.id).filter(Boolean),explanation:o.why};
}};
/* ---------- סוכן 8: מבקר סטייל (קוד רגיל, בלי AI) ---------- */
const CriticAgent={review(items,occ,w,canOuter){
  const o=OCCASIONS.find(x=>x.id===occ),issues=[],has=c=>items.some(i=>i.category===c);
  if(!has('shoes'))issues.push('חסרות נעליים');
  if(!has('dress')&&!(has('top')&&has('bottom')))issues.push('חסרה חולצה ומכנס (או שמלה)');
  for(const c of ['top','bottom','dress','shoes','outerwear'])if(items.filter(i=>i.category===c).length>1)issues.push('יותר מפריט אחד מקטגוריית '+CAT(c));
  if(has('dress')&&(has('top')||has('bottom')))issues.push('שמלה לא משלבים עם חולצה או מכנס');
  if(needsOuter(w)&&canOuter&&!has('outerwear'))issues.push('חסר מעיל או ג׳קט למזג האוויר');
  items.forEach(i=>{
    if(!formalityOK(i,o))issues.push(CAT(i.category)+': רמת הפורמליות לא מתאימה לאירוע');
    if(!seasonOK(i,w.temperatureC))issues.push(CAT(i.category)+': לא מתאים לטמפרטורה');});
  const col=new Set(items.filter(i=>!['shoes','accessory'].includes(i.category)&&!NEUTRAL.includes(i.color)).map(i=>i.color));
  if(col.size>2)issues.push('יותר מדי צבעים בולטים');
  if(items.filter(i=>i.color==='multi').length>1)issues.push('יותר מפריט אחד צבעוני');
  return{approved:!issues.length,issues};
}};

/* מיקום הפריט בתוך התמונה שלו (שבר מהרוחב והגובה). לפריטים ישנים מחושב מהתמונה פעם אחת */
async function boxOf(it,im){
  const n=200,k=Math.min(1,n/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let a=w,b=h,r=0,t=0;
  for(let y=0;y<h;y++)for(let u=0;u<w;u++){const p=(y*w+u)*4;
    const on=it.studio?Math.abs(d[p]-235)+Math.abs(d[p+1]-234)+Math.abs(d[p+2]-230)>45:d[p+3]>20;
    if(on){if(u<a)a=u;if(u>r)r=u;if(y<b)b=y;if(y>t)t=y;}}
  const bx=r<a?[0,0,1,1]:[a/w,b/h,(r-a+1)/w,(t-b+1)/h];
  it.box=bx;try{await DB.put('items',it);}catch(e){}return bx;
}
async function flat(blob){
  const i=await loadImg(blob),k=Math.min(1,500/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data;
  for(let p=0;p<d.length;p+=4){d[p]=Math.min(255,d[p]*255/235);d[p+1]=Math.min(255,d[p+1]*255/234);d[p+2]=Math.min(255,d[p+2]*255/230);}
  x.putImageData(im,0,0);return new Promise(r=>c.toBlob(r,'image/png'));
}
async function drawFigure(host,items){

  const layer=(f,[tx,ty,tw,th],o={})=>{
    const iw=f.b[2],ih=f.b[3]*f.ar,s=Math.min(tw/iw,th/ih),x=tx+(tw-iw*s)/2-f.b[0]*s,y=(o.bottom?ty+th-ih*s:ty)-f.b[1]*f.ar*s;

    return e;};

/* ---------- סט להיום ---------- */
async function freshWeather(){
  if(state.weather&&Date.now()-state.weather.at<18e5)return state.weather;
  let w;try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,maximumAge:36e5}));
    const c=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude.toFixed(1)}&longitude=${pos.coords.longitude.toFixed(1)}&current=temperature_2m,precipitation&timezone=auto`)).json()).current;
    w={temperatureC:Math.round(c.temperature_2m),isRaining:c.precipitation>0,known:true};
  }catch(e){w={temperatureC:22,isRaining:false,known:false};}
  return state.weather={...w,at:w.known?Date.now():0};
}
const okItems=(w)=>{const o=OCCASIONS.find(x=>x.id===state.occasion);return state.items.filter(i=>i.status==='ready'&&formalityOK(i,o)&&seasonOK(i,w.temperatureC));};
async function generate(){
  const my=++state.gen;state.status='loading';state.msg='';state.worn=false;render();
  try{
    const w=await freshWeather(),ok=okItems(w),by=c=>ok.filter(i=>i.category===c);
    const missing=[];
    if(!by('shoes').length)missing.push('נעליים');
    if(!by('dress').length&&!(by('top').length&&by('bottom').length))missing.push('חולצה ומכנס (או שמלה)');
    if(missing.length){state.status='missing';state.msg=missing.join(' ו');render();return;}
    const canOuter=by('outerwear').length>0,prev=state.outfit?.ids||[];
    const cands=['top','bottom','dress','shoes','accessory',...(needsOuter(w)?['outerwear']:[])].flatMap(c=>shuffle(by(c)).slice(0,25));
    let best=null,fb='';
    for(let n=0;n<3;n++){           // ניסיון ראשון ועוד עד שני תיקונים
      const p=await StylistAgent.propose(cands,state.occasion,w,fb,prev);
      const items=p.itemIds.map(id=>ok.find(i=>i.id===id)).filter(Boolean),v=CriticAgent.review(items,state.occasion,w,canOuter);
      if(!best||v.issues.length<best.v.issues.length)best={p,items,v};
      if(v.approved)break;fb=v.issues.join('; ');
    }
    if(my!==state.gen)return;
    state.outfit={ids:best.items.map(i=>i.id),why:best.p.explanation};state.issues=best.v.issues;state.status='ready';
  }catch(e){if(my!==state.gen)return;state.status='error';state.msg=e.message;}
  render();
}

    const items=state.outfit.ids.map(id=>state.items.find(i=>i.id===id)).filter(Boolean).sort((a,b)=>ORDER.indexOf(a.category)-ORDER.indexOf(b.category));
    body=`<div class="chips" style="margin:6px 0 10px">${[['man','גבר'],['woman','אישה']].map(([k,l])=>`<button class="chip sm" data-fig="${k}" aria-pressed="${(localStorage.getItem('figure')==='woman'?'woman':'man')===k}">${l}</button>`).join('')}</div>
      <div class="fig" id="fig"></div>
      <p class="hint" style="text-align:center">הדמות להמחשה בלבד: תמונות הבגדים מונחות עליה, בלי התאמת מידות.</p>
      <div class="grid two">${items.map(i=>`<button class="cell" data-sw="${i.id}"><img alt="" data-t="${i.imageId}" ${i.studio?'data-s':''}><span class="cap">${CAT(i.category)}</span></button>`).join('')}</div>
      <p class="hint">לחיצה על פריט מחליפה אותו.</p>
      <p class="why">${esc(state.outfit.why||'')}</p>
      ${state.issues.length?`<p class="note">זה הסט הכי קרוב שמצאתי. שים לב: ${state.issues.join('. ')}.</p>`:''}
      <div class="row"><button class="btn big primary" id="wore" ${state.worn?'disabled':''}>${state.worn?'נרשם: לבשתי היום':'לבשתי היום'}</button></div>
      <div class="row"><button class="btn" id="again">צור שוב</button></div>`;
  }
  v.innerHTML=`<p class="sub">${wl||'לאיזה אירוע מתלבשים?'}</p>
    <div class="chips">${OCCASIONS.map(o=>`<button class="chip" data-o="${o.id}" aria-pressed="${o.id===state.occasion}">${o.label}</button>`).join('')}</div>`+body;
  v.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.occasion=c.dataset.o;state.outfit=null;state.status='idle';render();});
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab='closet';render();});
  v.querySelectorAll('#again').forEach(b=>b.onclick=generate);
  v.querySelectorAll('img[data-t]').forEach(async im=>{const b=await ImageStore.load(im.dataset.t);if(b){const u=URL.createObjectURL(b);urls.push(u);im.src=u;}});
  v.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>openSwap(b.dataset.sw));
  const fg=$('#fig');if(fg)drawFigure(fg,state.outfit.ids.map(id=>state.items.find(i=>i.id===id)).filter(Boolean));
  v.querySelectorAll('[data-fig]').forEach(b=>b.onclick=()=>{localStorage.setItem('figure',b.dataset.fig);render();});
  const wore=$('#wore');if(wore)wore.onclick=async()=>{
    const items=state.outfit.ids.map(id=>state.items.find(i=>i.id===id)).filter(Boolean);
    await DB.put('outfits',newOutfit(state.occasion,state.outfit.ids,state.outfit.why,state.weather?.temperatureC));
    for(const i of items){i.lastWornAt=Date.now();await DB.put('items',i);}
    state.worn=true;render();};
}
/* החלפת פריט: רק פריטים מאותה קטגוריה שמתאימים לאירוע ולמזג האוויר */
const sw=$('#swap');
function openSwap(id){
  const cur=state.items.find(i=>i.id===id),w=state.weather;
  const alts=okItems(w).filter(i=>i.category===cur.category&&!state.outfit.ids.includes(i.id));
  $('#swapGrid').innerHTML=alts.length?alts.map(i=>`<button class="cell" data-pick="${i.id}"><img alt="" data-t="${i.thumbId}" ${i.studio?'data-s':''}></button>`).join(''):'<p class="sub">אין פריט אחר מתאים בקטגוריה הזו.</p>';
  $('#swapGrid').querySelectorAll('img[data-t]').forEach(async im=>{const b=await ImageStore.load(im.dataset.t);if(b){const u=URL.createObjectURL(b);urls.push(u);im.src=u;}});
  $('#swapGrid').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    state.outfit.ids=state.outfit.ids.map(x=>x===id?b.dataset.pick:x);
    const items=state.outfit.ids.map(x=>state.items.find(i=>i.id===x)).filter(Boolean);
    state.issues=CriticAgent.review(items,state.occasion,w,okItems(w).some(i=>i.category==='outerwear')).issues;
    state.worn=false;sw.close();render();});
  sw.showModal();
}
sw.addEventListener('click',e=>{if(e.target===sw)sw.close();});

/* ---------- לוז שבועי ---------- */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const newDay=date=>({date,occasion:'everyday',status:'empty',ids:[],why:'',issues:[],worn:false,temp:null,rain:false,known:true,repeated:false,msg:''});
function normalizePlan(saved=[]){return Array.from({length:7},(_,k)=>{const dt=new Date();dt.setDate(dt.getDate()+k);const date=ymd(dt);return saved.find(d=>d.date===date)||newDay(date);});}
const savePlan=()=>DB.put('outfits',{id:'plan',kind:'plan',days:state.plan});
const BASE=['top','bottom','dress'];

async function getForecast(){
  if(state.fc&&state.fc.date===ymd(new Date())&&Date.now()-state.fc.at<18e5)return state.fc.days;
  let days,known=true;
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,maximumAge:36e5}));
    const d=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude.toFixed(1)}&longitude=${pos.coords.longitude.toFixed(1)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&forecast_days=7&timezone=auto`)).json()).daily;
    days=d.time.map((_,k)=>({temperatureC:Math.round(.6*d.temperature_2m_max[k]+.4*d.temperature_2m_min[k]),isRaining:d.precipitation_sum[k]>0.5,known:true}));
  }catch(e){known=false;days=Array.from({length:7},()=>({temperatureC:22,isRaining:false,known:false}));}
  state.fc={days,at:known?Date.now():0,date:ymd(new Date())};return days;
}
const setWx=(d,f)=>{d.temp=f.temperatureC;d.rain=f.isRaining;d.known=f.known;};

/* סטייליסט + מבקר: עד 3 ניסיונות, ואם אף אחד לא עובר, הכי קרוב */
async function compose(ok,occ,w,avoid=[]){
  const by=c=>ok.filter(i=>i.category===c),canOuter=by('outerwear').length>0;
  const cands=['top','bottom','dress','shoes','accessory',...(needsOuter(w)?['outerwear']:[])].flatMap(c=>shuffle(by(c)).slice(0,25));
  let best=null,fb='';
  for(let n=0;n<3;n++){
    const p=await StylistAgent.propose(cands,occ,w,fb,avoid);
    const items=p.itemIds.map(id=>ok.find(i=>i.id===id)).filter(Boolean),v=CriticAgent.review(items,occ,w,canOuter);
    if(!best||v.issues.length<best.v.issues.length)best={p,items,v};
    if(v.approved)break;fb=v.issues.join('; ');
  }
  return{ids:best.items.map(i=>i.id),why:best.p.explanation,issues:best.v.issues};
}
/* בניית יום אחד. חולצות, מכנסיים ושמלות שכבר היו השבוע לא חוזרים, אלא אם הארון קטן מדי */
async function buildDay(d,used,avoid=[]){
  const w={temperatureC:d.temp,isRaining:d.rain},o=OCCASIONS.find(x=>x.id===d.occasion);
  const ok=state.items.filter(i=>i.status==='ready'&&formalityOK(i,o)&&seasonOK(i,w.temperatureC));
  const has=(p,c)=>p.some(i=>i.category===c),base=p=>has(p,'dress')||(has(p,'top')&&has(p,'bottom'));
  const missing=[];if(!has(ok,'shoes'))missing.push('נעליים');if(!base(ok))missing.push('חולצה ומכנס (או שמלה)');
  if(missing.length){Object.assign(d,{status:'missing',msg:missing.join(' ו'),ids:[],issues:[]});return;}
  const fresh=ok.filter(i=>!(BASE.includes(i.category)&&used.includes(i.id)));
  const enough=has(fresh,'shoes')&&base(fresh),r=await compose(enough?fresh:ok,d.occasion,w,[...used,...avoid]);
  Object.assign(d,{status:'ready',ids:r.ids,why:r.why,issues:r.issues,repeated:!enough&&used.length>0,worn:false});
}
const baseIds=ids=>ids.filter(id=>BASE.includes(state.items.find(i=>i.id===id)?.category));
async function buildWeek(){
  if(state.planBusy)return;state.planBusy=true;
  state.plan.forEach(d=>Object.assign(d,{status:d.occasion==='none'?'skip':'empty',ids:[],worn:false}));
  try{
    const fc=await getForecast(),used=[];
    for(let k=0;k<7;k++){
      const d=state.plan[k];state.planCur=k;await render();
      if(d.occasion==='none')continue;
      setWx(d,fc[k]);
      try{await buildDay(d,used);}catch(e){Object.assign(d,{status:'error',msg:e.message,ids:[]});}
      used.push(...baseIds(d.ids));await savePlan();
    }
  }finally{state.planBusy=false;state.planCur=-1;await savePlan();render();}
}
async function rebuildDay(k){
  if(state.planBusy)return;state.planBusy=true;state.planCur=k;const d=state.plan[k],prev=d.ids;await render();
  try{
    setWx(d,(await getForecast())[k]);
    await buildDay(d,state.plan.flatMap((x,j)=>j===k?[]:baseIds(x.ids)),prev);
  }catch(e){Object.assign(d,{status:'error',msg:e.message,ids:[]});}
  state.planBusy=false;state.planCur=-1;await savePlan();render();
}
async function wearDay(k){
  const d=state.plan[k],items=d.ids.map(id=>state.items.find(i=>i.id===id)).filter(Boolean);
  await DB.put('outfits',{...newOutfit(d.occasion,d.ids,d.why,d.temp),wornOn:Date.now()});
  for(const i of items){i.lastWornAt=Date.now();await DB.put('items',i);}
  d.worn=true;await savePlan();render();
}
const fillImgs=root=>root.querySelectorAll('img[data-t]').forEach(async im=>{const b=await ImageStore.load(im.dataset.t);if(b){const u=URL.createObjectURL(b);urls.push(u);im.src=u;}});

async function renderPlan(v){
  if(state.plan&&state.plan[0]?.date!==ymd(new Date())){state.plan=normalizePlan(state.plan);await savePlan();}  // האפליקציה נשארה פתוחה אחרי חצות
  const P=state.plan||[],busy=state.planBusy,built=P.some(d=>d.status==='ready');
  if(!state.items.some(i=>i.status==='ready')){
    v.innerHTML=`<div class="empty"><b>אין עדיין בגדים</b><p>צריך להוסיף בגדים לארון כדי לתכנן שבוע.</p><button class="btn primary" data-go>הוספת בגדים</button></div>`;
    v.querySelector('[data-go]').onclick=()=>{state.tab='closet';render();};return;
  }
  const card=(d,k)=>{
    const dt=new Date(d.date+'T12:00'),wx=d.temp!=null?`${d.temp}°${d.rain?', גשם':''}${d.known===false?' (משוער)':''}`:'';
    let body;
    if(state.planCur===k)body='<p class="sub">בונה…</p>';
    else if(d.status==='skip')body='<p class="sub">ללא סט ליום הזה.</p>';
    else if(d.status==='missing')body=`<p class="sub">אי אפשר לבנות סט. חסר בארון: ${d.msg}, שמתאים לאירוע ולמזג האוויר.</p>`;
    else if(d.status==='error')body=`<p class="sub">${esc(d.msg)}</p><div class="row"><button class="btn" data-redo="${k}" ${busy?'disabled':''}>נסה שוב</button></div>`;
    else if(d.status==='ready'){
      const items=d.ids.map(id=>state.items.find(i=>i.id===id)).filter(Boolean);
      body=`<div class="mini">${items.map(i=>`<div><img alt="" data-t="${i.thumbId}" ${i.studio?'data-s':''}></div>`).join('')}</div>
        <p>${esc(d.why||'')}</p>
        ${d.issues.length?`<p class="note">הסט הכי קרוב שמצאתי. שים לב: ${d.issues.join('. ')}.</p>`:''}
        ${d.repeated?'<p class="note">הארון קטן, אז חוזר על פריטים משבוע זה.</p>':''}
        ${items.length<d.ids.length?'<p class="note">פריט מהסט נמחק מהארון. מומלץ להחליף יום.</p>':''}
        <div class="row">${k===0?`<button class="btn primary" data-wear="${k}" ${d.worn?'disabled':''}>${d.worn?'נרשם: לבשתי':'לבשתי'}</button>`:''}<button class="btn" data-redo="${k}" ${busy?'disabled':''}>החלף יום</button></div>`;
    }else body=`<p class="sub">${busy?'ממתין לתור.':'עוד לא נבנה.'}</p>${busy?'':`<div class="row"><button class="btn" data-redo="${k}">בנה יום</button></div>`}`;
    return `<section class="day"><div class="head"><span><b>${k===0?'היום':dt.toLocaleDateString('he-IL',{weekday:'long'})}</b> <span class="muted">${dt.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}</span></span><span class="muted">${wx}</span></div>
      <select data-occ="${k}" aria-label="אירוע" ${busy?'disabled':''}>${[...OCCASIONS,{id:'none',label:'ללא סט'}].map(o=>`<option value="${o.id}"${o.id===d.occasion?' selected':''}>${o.label}</option>`).join('')}</select>${body}</section>`;
  };
  v.innerHTML=`<p class="sub">בוחרים אירוע לכל יום, ובונים את השבוע בלחיצה אחת.</p>
    <button class="btn primary big" id="build" ${busy?'disabled':''}>${built?'בנה מחדש את השבוע':'בנה את השבוע'}</button>
    <div class="strip">${P.map(card).join('')}</div>`;
  $('#build').onclick=buildWeek;
  v.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>rebuildDay(+b.dataset.redo));
  v.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>wearDay(+b.dataset.wear));
  v.querySelectorAll('[data-occ]').forEach(sel=>sel.onchange=async()=>{
    const d=P[+sel.dataset.occ];d.occasion=sel.value;d.ids=[];d.worn=false;d.status=sel.value==='none'?'skip':'empty';await savePlan();render();});
  fillImgs(v);
}

/* הגדרות */
const dlg=$('#settings'),st=$('#status');
const say=(t,c='')=>{st.textContent=t;st.className='status '+c;};
$('#gear').onclick=()=>{$('#key').value=Claude.key();$('#model').value=Claude.model();say('');dlg.showModal();};
const store=()=>{localStorage.setItem('apiKey',$('#key').value.trim());localStorage.setItem('model',$('#model').value.trim()||'claude-sonnet-5-5');};
$('#save').onclick=()=>{store();dlg.close();};
$('#test').onclick=async()=>{store();say('בודק…');try{await Claude.send({system:'ענה במילה אחת.',content:'אמור: תקין',maxTokens:20});say('החיבור תקין','ok');}catch(e){say(e.message,'err');}};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
$('#wipe').onclick=async()=>{if(!confirm('למחוק את כל הבגדים, הסטים והמפתח מהמכשיר? אי אפשר לשחזר.'))return;await DB.close();localStorage.clear();indexedDB.deleteDatabase('closet-ai').onsuccess=()=>location.reload();};


navigator.serviceWorker?.register('sw.js').catch(()=>{});
navigator.storage?.persist?.();  // מבקש מ-iOS לא למחוק את הנתונים
(async()=>{for(const i of await DB.all('items'))if(i.status==='processing'){i.status='pending';await DB.put('items',i);}state.plan=normalizePlan((await DB.get('outfits','plan'))?.days);await render();runQueue();migrateStudio();})();
</script>
